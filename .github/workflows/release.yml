name: Release

# Tag push only: builds installers into a draft release, published by hand after a look.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Draft release
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v5
      # Bundles take their version from tauri.conf.json, not the tag.
      - name: Check tag matches app version
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match tauri.conf.json version $version"
            exit 1
          fi
      # One draft up front; parallel tauri-action jobs would each create their own.
      - name: Create draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: |
            ### Which file do I need?

            - **Mac with Apple silicon (M1 or later):** the file ending in `aarch64.dmg`
            - **Mac with an Intel chip:** the file ending in `x64.dmg`
            - **Windows:** the file ending in `x64-setup.exe`. The `.msi` installs the same app, for managed machines.
            - **Linux:** the `.AppImage` runs on most distributions. Use the `.deb` on Debian or Ubuntu, or the `.rpm` on Fedora.

            ### Opening it the first time

            These builds aren't code-signed yet, so your computer will warn you the first time you open Bezl.

            - **macOS:** open the `.dmg` and drag Bezl into Applications. If macOS won't open it or says it's damaged, run `xattr -dr com.apple.quarantine /Applications/bezl.app` once in Terminal, then open Bezl again.
            - **Windows:** if SmartScreen stops the installer, click **More info**, then **Run anyway**.
            - **Linux:** make the AppImage executable with `chmod +x`, then run it.
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f name="Bezl $GITHUB_REF_NAME" \
            -f body="$NOTES" \
            -F draft=true \
            -F prerelease=true \
            --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          # 22.04 keeps the AppImage's glibc floor low.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tauriScript: bun tauri
          args: --target ${{ matrix.target }}
          releaseId: ${{ needs.release.outputs.id }}

  tidy:
    name: Drop raw app archives
    needs: [release, build]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      # tauri-action also uploads each .app as .app.tar.gz; only an updater reads those, and users mistake them for installers.
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ needs.release.outputs.id }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE/assets" \
            --jq '.[] | select(.name | endswith(".app.tar.gz")) | .id' |
            while read -r id; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
            done
