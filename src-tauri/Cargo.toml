[package]
name = "bezl"
version = "0.1.0"
description = "Bezl: local control plane for Codex, Claude Code and Gemini CLI workers"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "bezl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
portable-pty = "0.9.0"
# Pre-1.0 bindings: pinned exactly. Building needs Zig 0.15.2 (`brew install zig@0.15`) and fetches Ghostty.
libghostty-vt = "=0.2.2"
sha2 = "0.10"

[dev-dependencies]
proptest = "1"

# Demo driver's WKWebView snapshot; debug builds only use it.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSBitmapImageRep", "NSImage", "NSImageRep"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSString"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKWebView", "WKSnapshotConfiguration"] }
